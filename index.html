<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hashawn!</title>
<meta name="description" content="hashawn — a face on a ball, some posters, and Nardo.">
<meta name="theme-color" content="#009f4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/face/open_closed.webp">
<link rel="preload" as="image" href="assets/face/normal.webp">
</head>
<body>

<canvas id="face" aria-label="Hassan's face, on a ball. Drag to spin, tap to poke."></canvas>
<div class="bubble" id="bubble" hidden><span class="txt"></span></div>

<main>
  <header class="hero" id="hero">
    <svg class="logo" id="lockup" viewBox="0 0 906 205" aria-label="hashawn!"><use href="#logo"/></svg>
    <nav class="dock pills" aria-label="Links">
      <a class="dk" href="https://instagram.com/hashawnnn" target="_blank" rel="noopener" aria-label="Instagram, @hashawnnn" title="@hashawnnn"><img class="pfp" src="assets/pfp.png" alt="" width="160" height="160"></a>
      <a class="dk" href="nardo/" aria-label="Nardo" title="nardo"><svg><use href="#nardo"/></svg></a>
      <a class="dk" href="blog/" aria-label="Blog" title="blog"><svg><use href="#i-pen"/></svg></a>
      <a class="dk" href="tools/" aria-label="Tools" title="tools"><svg><use href="#i-wrench"/></svg></a>
      <a class="dk" href="mailto:hi@hashawn.com" aria-label="Email" title="mail"><svg><use href="#i-mail"/></svg></a>
      <a class="dk" href="https://github.com/hshwn" target="_blank" rel="noopener" aria-label="GitHub" title="github"><svg><use href="#i-github"/></svg></a>
      <button class="dk" id="mute" aria-pressed="false" aria-label="Mute him" title="sound"><svg class="on"><use href="#i-speaker"/></svg><svg class="off"><use href="#i-speaker-x"/></svg></button>
    </nav>
  </header>

  <section class="grid" id="grid" aria-label="Posters">
    <a class="poster" href="assets/poupees.webp" data-id="poupees" data-title="Les Poupées de Paris" data-line="twelve badges. one afternoon. five colors and a lot of liberace.">
      <img src="assets/poupees-thumb.jpg" alt="Les Poupées de Paris, a sheet of twelve showbiz badges" width="1131" height="1600" loading="lazy">
      <div class="meta">
        <p class="cap"><b>Les Poupées de Paris</b><span>2026</span><span>lettering, badges</span></p>
      </div>
    </a>
    <a class="poster" href="assets/harvest.jpg" data-id="harvest" data-title="Harvest Everything!" data-line="every single doodle drawn on a trackpad. the phone has a cord because it's a nice phone.">
      <img src="assets/harvest-thumb.jpg" alt="Harvest Everything, a doodle poster" width="905" height="1280" loading="lazy">
      <div class="meta">
        <p class="cap"><b>Harvest Everything!</b><span>2026</span><span>type, trackpad doodles</span></p>
      </div>
    </a>
    <a class="poster" href="assets/ram.webp" data-id="ram" data-title="RAM!" data-line="the sheep are real. the threat is real. come get me chad gippity.">
      <img src="assets/ram-thumb.jpg" alt="RAM!, a sticker poster of a pile of rams" width="1131" height="1600" loading="lazy">
      <div class="meta">
        <p class="cap"><b>RAM!</b><span>2026</span><span>collage, type</span></p>
      </div>
    </a>
  </section>
</main>

<div class="shade" id="shade" hidden></div>

<script src="sprite.js"></script>
<script src="voice.js"></script>
<script src="sphere.js"></script>
<script src="site.js"></script>
</body>
</html>
