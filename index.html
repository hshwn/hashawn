<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hashawn!</title>
<meta name="description" content="hashawn — a face on a ball, some posters, and Nardo.">
<meta name="theme-color" content="#009f4d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/face/open_closed.webp">
<link rel="preload" as="image" href="assets/face/normal.webp">
</head>
<body>

<canvas id="face" aria-label="Hassan's face, on a ball. Drag to spin, tap to poke."></canvas>
<div class="bubble" id="bubble" hidden><span class="txt"></span></div>

<main>
  <header class="hero" id="hero">
    <svg class="logo" id="lockup" viewBox="0 0 906 205" aria-label="hashawn!"><use href="#logo"/></svg>
    <nav class="pills" aria-label="Links">
      <a class="pill ig" href="https://instagram.com/hashawnnn" target="_blank" rel="noopener"><img class="pfp" src="assets/pfp.png" alt="" width="160" height="160"><span>@hashawnnn</span></a>
      <a class="pill nardo" href="nardo/"><svg class="ic"><use href="#i-rays"/></svg><span>nardo</span></a>
      <a class="pill mail" href="mailto:hi@hashawn.com"><svg class="ic"><use href="#i-mail"/></svg><span>mail</span></a>
      <a class="pill gh" href="https://github.com/hshwn" target="_blank" rel="noopener"><svg class="ic"><use href="#i-github"/></svg><span>github</span></a>
      <button class="pill mute" id="mute" aria-pressed="false" aria-label="Mute him"><svg class="ic on"><use href="#i-speaker"/></svg><svg class="ic off"><use href="#i-speaker-x"/></svg></button>
    </nav>
  </header>

  <section class="grid" id="grid" aria-label="Posters">
    <a class="poster" href="assets/poupees.webp" data-id="poupees" data-title="Les Poupées de Paris" data-line="twelve badges. one afternoon. five colors and a lot of liberace.">
      <img src="assets/poupees-thumb.jpg" alt="Les Poupées de Paris, a sheet of twelve showbiz badges" width="1131" height="1600" loading="lazy">
      <div class="meta">
        <p class="cap"><b>Les Poupées de Paris</b><span>2026</span><span>lettering, badges</span></p>
      </div>
    </a>
    <a class="poster" href="assets/harvest.jpg" data-id="harvest" data-title="Harvest Everything!" data-line="every single doodle drawn on a trackpad. the phone has a cord because it's a nice phone.">
      <img src="assets/harvest-thumb.jpg" alt="Harvest Everything, a doodle poster" width="905" height="1280" loading="lazy">
      <div class="meta">
        <p class="cap"><b>Harvest Everything!</b><span>2026</span><span>type, trackpad doodles</span></p>
      </div>
    </a>
    <a class="poster" href="assets/ram.webp" data-id="ram" data-title="RAM!" data-line="the sheep are real. the threat is real. come get me chad gippity.">
      <img src="assets/ram-thumb.jpg" alt="RAM!, a sticker poster of a pile of rams" width="1131" height="1600" loading="lazy">
      <div class="meta">
        <p class="cap"><b>RAM!</b><span>2026</span><span>collage, type</span></p>
        <div class="strip" aria-label="Earlier versions">
          <button type="button" data-src="assets/process/ram-1.webp" data-say="v1. the caption was doing too much."><img src="assets/process/ram-1-t.jpg" alt="RAM! version 1" loading="lazy"><i>v1</i></button>
          <button type="button" data-src="assets/process/ram-2.webp" data-say="v2. big ram, one punchline."><img src="assets/process/ram-2-t.jpg" alt="RAM! version 2" loading="lazy"><i>v2</i></button>
          <button type="button" data-src="assets/process/ram-3.webp" data-say="v3. the letters finally got heavy enough."><img src="assets/process/ram-3-t.jpg" alt="RAM! version 3" loading="lazy"><i>v3</i></button>
          <button type="button" class="cur" data-src="assets/ram.webp" data-say="and this is the one."><img src="assets/process/ram-final-t.jpg" alt="RAM! final" loading="lazy"><i>final</i></button>
        </div>
      </div>
    </a>
  </section>
</main>

<div class="shade" id="shade" hidden></div>

<script src="sprite.js"></script>
<script src="voice.js"></script>
<script src="sphere.js"></script>
<script src="site.js"></script>
</body>
</html>
