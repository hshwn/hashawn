<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hashawn!</title>
<meta name="description" content="hashawn — posters, stickers, and Nardo.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<main class="home">

  <header class="top">
    <svg class="logo" viewBox="0 0 906 205" aria-label="hashawn!"><use href="#logo"/></svg>
  </header>

  <nav class="pills" id="sheet" aria-label="Links">
    <a class="sticker pill ig" data-id="ig" href="https://instagram.com/hashawnnn" target="_blank" rel="noopener" style="--rot:-4deg; --i:0">
      <img class="pfp" src="assets/pfp.png" alt="" width="160" height="160"><span>@hashawnnn</span>
    </a>
    <a class="sticker pill nardo" data-id="nardo" href="nardo/" style="--rot:3deg; --i:1">
      <svg class="ic"><use href="#i-rays"/></svg><span>nardo</span>
    </a>
    <a class="sticker pill mail" data-id="mail" href="mailto:hi@hashawn.com" style="--rot:-2deg; --i:2">
      <svg class="ic"><use href="#i-mail"/></svg><span>mail</span>
    </a>
    <a class="sticker pill gh" data-id="gh" href="https://github.com/hshwn" target="_blank" rel="noopener" style="--rot:5deg; --i:3">
      <svg class="ic"><use href="#i-github"/></svg><span>github</span>
    </a>
  </nav>

  <section class="grid" aria-label="Posters">
    <a class="poster" href="assets/poupees.jpg" data-title="Les Poupées de Paris">
      <img src="assets/poupees-thumb.jpg" alt="Les Poupées de Paris, a sheet of twelve showbiz badges" width="640" height="558" loading="lazy">
    </a>
    <a class="poster" href="assets/harvest.jpg" data-title="Harvest Everything!">
      <img src="assets/harvest-thumb.jpg" alt="Harvest Everything, a doodle poster" width="640" height="905" loading="lazy">
    </a>
    <a class="poster" href="assets/ram.jpg" data-title="RAM!">
      <img src="assets/ram-thumb.jpg" alt="RAM!, a sticker poster of a pile of rams" width="640" height="902" loading="lazy">
    </a>
  </section>

</main>

<div class="lightbox" id="lightbox" hidden>
  <img alt="">
  <p class="cap"></p>
</div>

<script src="sprite.js"></script>
<script src="site.js"></script>
</body>
</html>
